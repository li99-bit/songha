<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐰 李松河泡泡聊天室 | 心动语音·ENFJ恋人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f7a1bc 0%, #f7b5cb 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Segoe UI', 'SF Pro Text', -apple-system, 'Noto Sans KR', sans-serif;
            padding: 16px; margin: 0;
        }
        .phone-app {
            width: 100%; max-width: 380px; height: 700px; background-color: #fff2f8;
            border-radius: 44px; box-shadow: 0 30px 40px rgba(0,0,0,0.25), 0 0 0 8px #fcd9e6, 0 0 0 12px #f8c4d6;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column;
            gap: 12px; background-size: cover; background-position: center; background-repeat: no-repeat;
            scroll-behavior: smooth;
        }
        .floating-bears { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
        .bear { position: absolute; font-size: 28px; animation: fall linear forwards; user-select: none; opacity: 0.75; }
        @keyframes fall { 0% { transform: translateY(-30px) rotate(0deg); opacity: 0.8; } 100% { transform: translateY(740px) rotate(12deg); opacity: 0; } }
        .chat-header {
            background: #ffb3c6; padding: 12px 16px 10px 16px; border-bottom: 2px solid #ff9bb2;
            display: flex; align-items: center; gap: 8px; flex-shrink: 0; z-index: 2;
        }
        .profile-area { display: flex; align-items: center; gap: 10px; flex: 1; }
        .avatar-wrapper { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2.5px solid white; background-color: #ffe0e7; box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: block; }
        .change-avatar-btn { position: absolute; bottom: -4px; right: -8px; background: #ff6b8f; border: none; color: white; font-size: 14px; border-radius: 30px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.1s; }
        .change-avatar-btn:active { transform: scale(0.92); }
        .artist-info { display: flex; flex-direction: column; flex: 1; }
        .artist-name { font-weight: 800; font-size: 15px; color: #572c3e; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .badge { background: #ffda77; font-size: 8px; padding: 2px 6px; border-radius: 30px; color: #572c3e; font-weight: bold; }
        .status { font-size: 9px; color: #ac5775; margin-top: 2px; }
        .favor-row { background: #ffe2ec; border-radius: 40px; padding: 3px 10px; margin-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .favor-label { font-size: 10px; font-weight: bold; color: #b34e6e; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
        .favor-bar-micro { flex: 1; height: 4px; background: #ffc0d0; border-radius: 10px; overflow: hidden; }
        .favor-fill-micro { height: 100%; width: 0%; background: #ff6b8f; border-radius: 10px; transition: width 0.3s ease; }
        .favor-percent-text { font-size: 10px; font-weight: bold; color: #c45a7a; min-width: 42px; text-align: right; }
        .header-actions { display: flex; gap: 6px; }
        .icon-btn { background: #ff8aa8; border: none; color: white; font-size: 16px; width: 34px; height: 34px; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; }
        .icon-btn:active { transform: scale(0.94); }
        .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeInUp 0.2s ease-out; position: relative; }
        .msg-delete { position: absolute; right: -28px; top: 20px; font-size: 14px; background: rgba(255,107,145,0.8); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; opacity: 0; transition: 0.1s; z-index: 5; }
        .message:hover .msg-delete { opacity: 1; }
        .user .msg-delete { right: auto; left: -28px; }
        .message.user { align-self: flex-end; }
        .message.songha { align-self: flex-start; }
        .bubble { padding: 10px 14px; border-radius: 22px; font-size: 13px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
        .user .bubble { background: #ffbfcf; color: #351f28; border-bottom-right-radius: 5px; font-weight: 500; }
        .songha .bubble { background: white; border: 1px solid #ffd0dd; color: #4f2e3c; border-bottom-left-radius: 5px; }
        .voice-bubble { background: #ffe8f0 !important; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .voice-icon { font-size: 18px; animation: pulse 1s infinite; }
        .voice-duration { font-size: 11px; font-weight: 500; color: #b34e6e; background: rgba(255,255,255,0.6); padding: 2px 6px; border-radius: 20px; }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(1);} 100% { opacity: 1; transform: scale(1.1);} }
        .message-name { font-size: 10px; margin-bottom: 4px; margin-left: 8px; color: #cf7e9b; font-weight: 600; }
        .user .message-name { text-align: right; margin-right: 8px; margin-left: 0; }
        .timestamp { font-size: 8px; color: #dd9fb5; margin-top: 4px; margin-left: 12px; }
        .user .timestamp { text-align: right; margin-right: 12px; }
        .input-area { background: #ffeef4; padding: 10px 14px; border-top: 1px solid #ffdae5; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .ins-icon-btn { background: #ffb3c6; border: none; width: 42px; height: 42px; border-radius: 30px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #572c3e; transition: 0.1s; }
        .ins-icon-btn:active { transform: scale(0.94); }
        .input-wrapper { flex: 1; display: flex; gap: 8px; align-items: center; }
        .input-box { flex: 1; background: white; border: none; border-radius: 30px; padding: 10px 16px; font-size: 13px; outline: none; resize: none; font-family: inherit; }
        .send-btn { background: #ff89aa; border: none; width: 42px; height: 42px; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: white; transition: 0.1s; }
        .send-btn:active { transform: scale(0.94); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: #ffe2ec; border-radius: 10px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #f5a7c0; border-radius: 10px; }
        .ins-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 200;
            transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex; flex-direction: column; border-radius: 44px; overflow-y: auto; box-shadow: 4px 0 20px rgba(0,0,0,0.2);
        }
        .ins-panel.open { transform: translateX(0); }
        .ins-header { background: #ffb3c6; padding: 18px 18px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ff9bb2; }
        .ins-header h2 { font-size: 18px; color: #572c3e; }
        .close-ins { background: rgba(0,0,0,0.2); border: none; font-size: 22px; border-radius: 30px; width: 34px; cursor: pointer; }
        .ins-cover { width: 100%; height: 140px; background-size: cover; background-position: center; background-color: #ffdae5; position: relative; cursor: pointer; }
        .ins-cover-edit { position: absolute; bottom: 8px; right: 12px; background: rgba(0,0,0,0.5); color: white; font-size: 12px; padding: 4px 8px; border-radius: 20px; backdrop-filter: blur(4px); }
        .ins-profile { padding: 16px; text-align: center; border-bottom: 1px solid #ffe2ec; margin-top: -30px; position: relative; z-index: 2; }
        .ins-avatar-lg { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; border: 3px solid white; cursor: pointer; }
        .ins-stats { display: flex; justify-content: center; gap: 24px; margin: 10px 0; }
        .stat-item { text-align: center; cursor: pointer; }
        .stat-number { font-weight: bold; font-size: 16px; color: #2c1a23; }
        .stat-label { font-size: 10px; color: #ac5775; text-transform: uppercase; letter-spacing: 0.5px; }
        .ins-nickname { font-size: 18px; font-weight: bold; color: #2c1a23; margin-top: 5px; }
        .ins-bio { font-size: 11px; color: #ac5775; margin-top: 4px; }
        .edit-ins-btn { background: #ffe2ec; border: none; padding: 5px 14px; border-radius: 40px; margin-top: 8px; font-size: 11px; cursor: pointer; }
        .ins-posts { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
        .post-card { background: #fff9fb; border-radius: 24px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #ffdae5; }
        .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .post-user { font-weight: bold; color: #572c3e; flex: 1; font-size: 13px; }
        .post-actions { display: flex; gap: 10px; }
        .post-action-btn { background: none; border: none; font-size: 14px; cursor: pointer; padding: 4px; border-radius: 30px; }
        .post-content { font-size: 13px; margin: 8px 0; line-height: 1.4; }
        .comment-section { margin-top: 10px; border-top: 1px solid #ffe2ec; padding-top: 10px; }
        .comment-item { background: #fff0f5; border-radius: 20px; padding: 6px 10px; margin-bottom: 6px; font-size: 11px; }
        .comment-input-area { display: flex; gap: 8px; margin-top: 8px; }
        .comment-input { flex: 1; border: 1px solid #ffc0d0; border-radius: 40px; padding: 6px 10px; font-size: 11px; }
        .comment-submit { background: #ff89aa; border: none; border-radius: 30px; padding: 0 12px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; }
        .new-post-btn { background: #ff6b8f; border: none; color: white; padding: 10px; border-radius: 40px; margin: 6px 14px 14px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .toast-message { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: white; padding: 6px 16px; border-radius: 40px; font-size: 12px; z-index: 300; backdrop-filter: blur(8px); pointer-events: none; animation: fadeOut 2s ease forwards; }
        @keyframes fadeOut { 0% { opacity: 0; transform: translateX(-50%) translateY(8px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 85% { opacity: 1; transform: translateX(-50%) translateY(0); } 100% { opacity: 0; transform: translateX(-50%) translateY(-8px); visibility: hidden; } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-card { background: white; width: 280px; border-radius: 32px; padding: 20px; text-align: center; }
        .modal-card input, .modal-card textarea { width: 100%; margin: 8px 0; padding: 8px 12px; border-radius: 30px; border: 1px solid #ffc0d0; }
        .modal-card button { background: #ff89aa; border: none; padding: 8px 14px; border-radius: 40px; margin: 4px; cursor: pointer; font-size: 12px; }
        .danger-btn { background: #d96c8a; }
        .model-item { padding: 4px 8px; background: #ffeef4; margin: 4px; border-radius: 20px; cursor: pointer; font-size: 11px; }
        .bg-preview { width: 100%; height: 60px; background-size: cover; border-radius: 12px; margin: 8px 0; }
    </style>
</head>
<body>
<div class="phone-app">
    <div class="floating-bears" id="bearContainer"></div>
    <div class="chat-header">
        <div class="profile-area">
            <div class="avatar-wrapper"><img id="avatarImg" class="avatar-img" src="https://picsum.photos/id/20/100/100" alt="myAvatar"><button class="change-avatar-btn" id="changeAvatarBtn">📷</button></div>
            <div class="artist-info">
                <div class="artist-name">이송하 · LEE SONGHA <span class="badge">🐣 练习生 · ENFJ</span></div>
                <div class="status" id="liveStatus">💗 等待你的消息...</div>
                <div class="favor-row"><span class="favor-label">💕 心意值</span><div class="favor-bar-micro"><div class="favor-fill-micro" id="favorFillMini"></div></div><span class="favor-percent-text" id="favorPercent">0%</span></div>
            </div>
        </div>
        <div class="header-actions"><button class="icon-btn" id="userSettingsBtn">👤</button><button class="icon-btn" id="apiConfigBtn">⚙️</button><button class="icon-btn" id="recordMenuBtn">📋</button></div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="input-area"><button class="ins-icon-btn" id="insHomeBtn">📲</button><div class="input-wrapper"><textarea rows="1" class="input-box" id="messageInput" placeholder="TO. 송하 💬 输入任何话..."></textarea><button class="send-btn" id="sendBtn">➤</button></div></div>

    <!-- INS 个人主页 -->
    <div id="insPanel" class="ins-panel">
        <div class="ins-header"><h2>📸 INS 个人主页</h2><button class="close-ins" id="closeInsBtn">✕</button></div>
        <div class="ins-cover" id="insCover" style="background-image: url('https://picsum.photos/id/104/400/200');"><div class="ins-cover-edit">📷 更换背景</div></div>
        <div class="ins-profile">
            <img id="insAvatarImg" class="ins-avatar-lg" src="https://picsum.photos/id/20/100/100" alt="avatar">
            <div class="ins-stats"><div class="stat-item" id="editPostsStat"><div class="stat-number" id="insPostsCount">0</div><div class="stat-label">Posts</div></div><div class="stat-item" id="editFollowersStat"><div class="stat-number" id="insFollowers">128</div><div class="stat-label">Followers</div></div><div class="stat-item" id="editFollowingStat"><div class="stat-number" id="insFollowing">95</div><div class="stat-label">Following</div></div></div>
            <div class="ins-nickname" id="insNickname">나의 별</div><div class="ins-bio" id="insBio">✨ 喜欢星星和音乐 ✨</div>
            <button class="edit-ins-btn" id="editProfileBtn">✏️ 编辑资料</button>
        </div>
        <div class="ins-posts" id="insPostsContainer"></div><button class="new-post-btn" id="newPostBtn">+ 发布新帖</button>
    </div>

    <!-- 模态框 -->
    <div id="editProfileModal" class="modal-overlay"><div class="modal-card"><h3>📝 个人资料</h3><input id="editNickname" placeholder="昵称"><textarea id="editBio" rows="2" placeholder="简介"></textarea><button id="saveProfileBtn">保存</button><button id="cancelProfileBtn">取消</button></div></div>
    <div id="editStatsModal" class="modal-overlay"><div class="modal-card"><h3>✏️ 自定义 INS 数据</h3><input id="editPostsNum" type="number" placeholder="Posts数量"><input id="editFollowersNum" type="number" placeholder="Followers数量"><input id="editFollowingNum" type="number" placeholder="Following数量"><button id="saveStatsBtn">保存</button><button id="cancelStatsBtn">取消</button></div></div>
    <div id="newPostModal" class="modal-overlay"><div class="modal-card"><h3>✨ 新帖子</h3><textarea id="postContentInput" rows="3" placeholder="分享心情..."></textarea><button id="submitPostBtn">发布</button><button id="cancelPostBtn">取消</button></div></div>
    <div class="modal-overlay" id="userModal"><div class="modal-card"><h3>👤 我的信息</h3><input id="userNameInput" placeholder="你的名字"><button id="saveUserBtn">💾 保存人设</button></div></div>
    <div class="modal-overlay" id="apiModal"><div class="modal-card"><h3>🔌 API 配置</h3><input id="apiBaseUrl" placeholder="API地址" value="https://api.siliconflow.cn/v1"><input id="apiKey" placeholder="API Key"><button id="fetchModelsBtn">📡 拉取模型列表</button><div id="modelListArea" style="max-height:80px; overflow:auto;"></div><button id="saveApiBtn">💾 保存</button><button id="testApiBtn">🔌 测试</button><div class="api-status" id="apiStatus" style="font-size:10px;"></div><hr><button id="changeBgBtn">🎨 更换聊天背景图</button></div></div>
    <div class="modal-overlay" id="recordModal"><div class="modal-card"><h3>📋 管理</h3><button id="clearAllChatBtn" class="danger-btn">🗑️ 清空记录</button><button id="archiveChatBtn">💾 存档</button><button id="loadArchiveBtn">📂 加载存档</button><input type="file" id="archiveFileInput" accept=".json" style="display:none;"></div></div>
    <input type="file" id="bgFileInput" accept="image/*" style="display:none;"><input type="file" id="insBgFileInput" accept="image/*" style="display:none;">
</div>

<script>
    (function(){
        // ---------- 好感度与核心数据 ----------
        let favorability = parseInt(localStorage.getItem('songha_favor') || '0');
        const MAX_FAVOR = 100;
        let userName = localStorage.getItem('user_name') || '친구';
        document.getElementById('userNameInput').value = userName;
        function updateFavorUI(){
            let percent = Math.floor((favorability/MAX_FAVOR)*100);
            document.getElementById('favorFillMini').style.width = `${percent}%`;
            document.getElementById('favorPercent').innerText = `${percent}%`;
            localStorage.setItem('songha_favor', favorability);
            let statusSpan = document.getElementById('liveStatus');
            if(favorability >= 85) statusSpan.innerText = "💞 超级黏人 • 想把你融入日常";
            else if(favorability >= 65) statusSpan.innerText = "💖 好感升温 • 总想到你";
            else if(favorability >= 40) statusSpan.innerText = "🌸 有点在意 • 想多了解你";
            else if(favorability >= 15) statusSpan.innerText = "🍃 初识 • 但觉得你很温暖";
            else statusSpan.innerText = "🌱 礼貌观察 • 期待更多对话";
        }
        function addFavorability(amount){ let newVal=Math.min(MAX_FAVOR, Math.max(0, favorability+amount)); if(newVal!==favorability){ favorability=newVal; updateFavorUI(); return true;} return false; }
        // 强化版好感变动 (符合人设雷点)
        function calculateFavorChange(msg){
            let lower = msg.toLowerCase();
            if(lower.includes('辛苦')||lower.includes('累吗')||lower.includes('还好吗')) return 5;
            if(lower.includes('喜欢')||lower.includes('想你')||lower.includes('보고 싶어')||lower.includes('좋아해')) return 6;
            if(lower.includes('可爱')||lower.includes('帅气')||lower.includes('예뻐')) return 4;
            if(lower.includes('冰淇淋')||lower.includes('公州')||lower.includes('咖啡')||lower.includes('拍照')) return 4;
            if(lower.includes('冷淡')||lower.includes('别烦我')||lower.includes('讨厌你')) return -15;
            if(lower.includes('练习没用')||lower.includes('放弃')||lower.includes('别练了')||lower.includes('否定付出')) return -20;
            if(lower.includes('成员')&&(lower.includes('差')||lower.includes('讨厌'))) return -12;
            if(lower.includes('안녕')||lower.includes('你好')) return 2;
            return 1;
        }
        
        // ---------- 聊天核心 ----------
        let chatMessagesData = [], nextMsgId=1, conversationHistory=[];
        let lastAssistantReply = "";
        let isReplying=false, pendingSend=false;
        let currentBaseUrl = localStorage.getItem('songha_base_url')||'https://api.siliconflow.cn/v1';
        let currentApiKey = localStorage.getItem('songha_api_key')||'';
        let currentModel = localStorage.getItem('songha_model')||'';
        let apiConfigured = !!(currentApiKey && currentBaseUrl);
        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const avatarImg = document.getElementById('avatarImg');
        
        // 聊天背景图
        const chatBgInput = document.getElementById('bgFileInput');
        function setChatBackground(imageUrl){ messagesContainer.style.backgroundImage = `url(${imageUrl})`; localStorage.setItem('chat_bg', imageUrl); }
        function loadChatBackground(){ let saved = localStorage.getItem('chat_bg'); if(saved) setChatBackground(saved); else messagesContainer.style.backgroundImage = ''; }
        document.getElementById('changeBgBtn').addEventListener('click',()=>chatBgInput.click());
        chatBgInput.onchange = e => { let file = e.target.files[0]; if(file){ let reader = new FileReader(); reader.onload = ev => setChatBackground(ev.target.result); reader.readAsDataURL(file); } };
        
        function showToast(msg){ let div=document.createElement('div'); div.className='toast-message'; div.innerText=msg; document.body.appendChild(div); setTimeout(()=>div.remove(),2000); }
        function getTime(){ const d=new Date(); return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; }
        function renderAllMessages(){ messagesContainer.innerHTML=''; chatMessagesData.forEach(m=>appendMsgEl(m)); messagesContainer.scrollTop=messagesContainer.scrollHeight; }
        function appendMsgEl(msg){
            const div=document.createElement('div'); div.className=`message ${msg.role}`; div.setAttribute('data-msg-id',msg.id);
            let bubbleContent = '';
            if(msg.role==='songha'){
                if(msg.isVoice){
                    // 严格格式: 🎙️---3s | 韩文(中文)
                    const duration = msg.voiceDuration || 3;
                    bubbleContent = `<div class="voice-bubble"><span class="voice-icon">🎙️</span><span class="voice-duration">---${duration}s</span> | ${msg.korean} (${msg.chinese})</div>`;
                } else {
                    bubbleContent = `${msg.korean} ${msg.extraEmoji||''}<br><span style="font-size:10px;color:#bf708c;">✧ 译：${msg.chinese}</span>`;
                }
            } else { bubbleContent = msg.content; }
            div.innerHTML=`<div class="message-name">${msg.role==='songha'?'🐰 송하':`✨ ${userName} ✨`}</div><div class="bubble ${msg.isVoice ? 'voice-bubble' : ''}">${bubbleContent}</div><div class="timestamp">${msg.timestamp}</div><div class="msg-delete" onclick="window.deleteMessageById(${msg.id})">❌</div>`;
            messagesContainer.appendChild(div);
        }
        window.deleteMessageById=(id)=>{ chatMessagesData=chatMessagesData.filter(m=>m.id!==id); renderAllMessages(); conversationHistory=chatMessagesData.map(m=>({role:m.role==='songha'?'assistant':'user', content:m.content||(m.korean+m.chinese)})); };
        function addMessage(role, korean, chinese, extra="", isVoice=false, voiceDuration=3){

        async function generateApiReply(userMsg){
            const systemPrompt = `你叫李松河(Songha)，04年白羊座，韩国忠清南道公州市出身。你是练习超过6年的练习生，ENFJ人格，责任感强、温柔包容、共情力高。182cm，私下活泼开朗像兔子，但舞台上正气凛然。爱一个人会变得黏人，主动分享日常，用行动表达关心。很会照顾人，习惯确认周围人的状态。回复必须【韩文+换行"译："中文】。好感度${favorability}/100，用户名为"${userName}"。根据好感度调整亲密程度。不要否定对方的努力，不要冷暴力。要展现出你温暖、细腻、喜欢记录生活的特质。`;
            let url = currentBaseUrl.replace(/\/$/,'')+'/chat/completions';
            let res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${currentApiKey}`}, body: JSON.stringify({model: currentModel, messages: [{role: 'system', content: systemPrompt}, ...conversationHistory.slice(-8), {role: 'user', content: userMsg}], temperature: 0.85, max_tokens: 350}) });
            if(!res.ok) throw new Error();
            let data = await res.json(); let content = data.choices?.[0]?.message?.content || '';
            let korean = content, chinese = "💕";
            if(content.includes('译：')){ let idx = content.indexOf('译：'); korean = content.substring(0, idx).trim(); chinese = content.substring(idx+3).trim(); }
            let final = applyFavorAndPersona(korean, chinese);
            return {korean: final.korean, chinese: final.chinese, extraEmoji: "💖🐰"};
        }

        document.getElementById('archiveFileInput').onchange=e=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=ev=>{ try{ let data=JSON.parse(ev.target.result); if(data.messages) chatMessagesData=data.messages; if(data.favorability!==undefined)favorability=data.favorability; if(data.userName)userName=data.userName; localStorage.setItem('user_name',userName); updateFavorUI(); renderAllMessages(); conversationHistory=chatMessagesData.map(m=>({role:m.role==='songha'?'assistant':'user', content:m.content||(m.korean+m.chinese)})); showToast("📂 存档加载成功"); }catch(e){ showToast("❌ 存档解析失败"); } }; reader.readAsText(file); };

        function init(){ loadChatBackground(); updateFavorUI(); if(chatMessagesData.length===0){ addMessage('songha','안녕~ 오늘 뭐하고 있었어? ☺️ 나 방금 연습 끝났어! 공주에서 맛있는 빵 사왔는데 같이 먹을래? 🍞',`嗨~ ${userName}今天在做什么呀？☺️ 我刚结束练习！从公州买了好吃的面包，要一起吃吗？🍞`,'🐇💗'); setTimeout(()=>addMessage('songha','아! 맞다, 다음 주에 공주 가기로 했는데 너랑 같이 아이스크림 먹고 싶다 🍦 우리 같이 갈래?',`啊！对了，下周决定回公州，想和${userName}一起吃冰淇淋🍦 我们一起去吗？`,'🍦🐰'),500); } else renderAllMessages(); setInterval(()=>{ if(Math.random()>0.7) createFloatingBear(); },13000); }
        init();
    })();
</script>
</body>
</html>
